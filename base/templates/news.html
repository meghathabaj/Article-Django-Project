{% extends 'main.html' %}
{% block content %}
{% load static %}

<link rel="stylesheet" href="{% static 'css/news.css' %}">
<div class="news-container">

    <h1>News</h1>
    <div class="news-grid">
        {% for i in data %}
        <div class="news-box">

            <img src="{{i.image}}" alt="">

            <h2>{{i.desc|truncatewords:8}}</h2>
            <a href="{% url 'read' i.id %}">Read More</a>
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
