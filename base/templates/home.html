{% extends 'main.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/home.css' %}?v=2">
<div class="home-container">

    {% for i in data %}
    <div class="card">
        <img src="{{i.image}}" alt="">
        <h1>{{i.title}}</h1>
        <h2>{{i.desc|truncatewords:5}}</h2>
        <a href="{% url 'read' i.id %}">Read More</a>

    </div>
    {% endfor %}
</div>
{% endblock %}
